name: Deploy Client to EC2

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag"
        required: true
        default: "latest"
      git_branch:
        description: "Branch to pull on the server"
        required: false
        default: "main"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            export IMAGE_TAG="${{ github.event.inputs.image_tag }}"
            export GIT_BRANCH="${{ github.event.inputs.git_branch }}"

            cd ~/project-1-storage-app-v2
            git fetch origin "$GIT_BRANCH"
            git checkout "$GIT_BRANCH"
            git pull --ff-only origin "$GIT_BRANCH"

            cd client
            bash ./deploy-client-docker.sh
